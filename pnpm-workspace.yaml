allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true

overrides:
  'vue': 'rc'
  '@vue/compiler-core': 'rc'
  '@vue/compiler-dom': 'rc'
  '@vue/compiler-sfc': 'rc'
  '@vue/compiler-ssr': 'rc'
  '@vue/compiler-vapor': 'rc'
  '@vue/reactivity': 'rc'
  '@vue/runtime-core': 'rc'
  '@vue/runtime-dom': 'rc'
  '@vue/runtime-vapor': 'rc'
  '@vue/server-renderer': 'rc'
  '@vue/shared': 'rc'
  '@vue/compat': 'rc'

peerDependencyRules:
  allowAny:
    - 'vue'

catalog:
  '@langchain/core': '^1.2.9'
  '@langchain/langgraph': '^1.4.14'
  'zod': '^4.5.4'
  '@langchain/classic': '^1.0.44'
  '@langchain/langgraph-checkpoint-sqlite': '^1.0.3'
  '@langchain/mcp-adapters': '1.1.3'
  '@langchain/openai': '1.5.6'
  '@langchain/textsplitters': '^1.0.1'
  '@modelcontextprotocol/sdk': '1.29.0'
  '@inquirer/prompts': '^8.5.2'
  'dotenv': '^17.4.2'
  'express': '5.2.1'
  'gray-matter': '^4.0.3'
  'langchain': '^1.5.5'
  'mammoth': '^1.12.1'
  'pdf-parse': '^2.4.5'
  'prettier': '3.9.5'

packages:
  - apps/*
